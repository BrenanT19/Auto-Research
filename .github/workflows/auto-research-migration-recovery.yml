name: Auto Research migration recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interrupted-migration-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: auto_research_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auto_research_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTO_RESEARCH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/auto_research_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check interrupted migration recovery
        run: pnpm --filter @workspace/scripts test:auto-research:interrupted-migration-recovery